<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>푸끼몬 신체검사 - 렌더 사이즈 체크</title>
  <style>
    :root{
      --navy:#08245f;
      --blue:#2563eb;
      --soft:#eef5ff;
      --line:#bfdbfe;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eaf3ff;color:var(--text)}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px;box-shadow:0 6px 20px rgba(15,23,42,.08)}
    h1{margin:0 0 6px;font-size:22px;color:var(--navy)}
    .sub{font-size:13px;color:var(--muted);line-height:1.45}
    .controls{display:grid;grid-template-columns:1.4fr repeat(4, minmax(120px,.4fr));gap:10px;margin-top:12px;align-items:center}
    input,select,button{height:38px;border:1px solid #bdd5ff;border-radius:12px;background:#fff;padding:0 12px;font-size:14px;color:#0f172a}
    button{cursor:pointer;font-weight:800;background:#0f2d77;color:#fff;border-color:#0f2d77;box-shadow:0 3px 0 #071a4a}
    button:active{transform:translateY(1px);box-shadow:0 2px 0 #071a4a}
    main{padding:18px}
    .summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;color:#1e3a8a;font-weight:800;font-size:13px}
    .badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px rgba(15,23,42,.08);overflow:hidden}
    .meta{padding:11px 12px 8px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .name{font-weight:900;color:#0b2c75;font-size:17px}.api{font-size:12px;color:var(--muted);font-weight:700}.stat{font-size:12px;color:#334155;text-align:right;line-height:1.45}
    .types{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.type{font-size:11px;background:#eef2ff;color:#1e3a8a;border-radius:999px;padding:3px 7px;font-weight:800}
    .mini-stage{position:relative;height:210px;margin:0 12px 12px;border:2px solid #3b82f6;border-radius:18px;overflow:hidden;background:linear-gradient(#7dd3fc,#c7f9cc 58%,#d8b56a 59%,#a3e635);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
    .mini-stage::before{content:"";position:absolute;inset:0;background-image:url('/assets/battle-field.png');background-size:cover;background-position:center;opacity:.96}
    .ground-line{position:absolute;left:7%;right:7%;bottom:42px;height:2px;background:rgba(15,23,42,.22);border-radius:99px;z-index:1}.ground-line::after{content:"baseline";position:absolute;right:0;bottom:3px;font-size:10px;color:rgba(15,23,42,.45);font-weight:800}
    .sprite-wrap{position:absolute;z-index:3;display:grid;align-items:end;justify-items:center;transform:translate(var(--pokemon-offset-x,0px),var(--pokemon-offset-y,0px));}
    .sprite-wrap.mine{left:50%;bottom:42px;transform:translate(calc(-50% + var(--pokemon-offset-x,0px)),var(--pokemon-offset-y,0px));}
    .sprite-wrap.opponent{right:50%;bottom:58px;transform:translate(calc(50% + var(--pokemon-offset-x,0px)),var(--pokemon-offset-y,0px));}
    .sprite-wrap.both-mine{left:26%;bottom:42px;transform:translate(calc(-50% + var(--pokemon-offset-x,0px)),var(--pokemon-offset-y,0px));}
    .sprite-wrap.both-opponent{right:26%;bottom:58px;transform:translate(calc(50% + var(--pokemon-offset-x,0px)),var(--pokemon-offset-y,0px));}
    .sprite{width:auto;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 12px 10px rgba(15,23,42,.32))}.sprite.missing{height:80px!important;width:80px!important;border-radius:16px;background:#e2e8f0;display:grid;place-items:center}
    .profile{margin:0 12px 12px;padding:10px;background:#f8fbff;border:1px solid #dbeafe;border-radius:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;white-space:pre-wrap;color:#1f2937;line-height:1.45}.warn{color:#b91c1c;font-weight:900}.ok{color:#166534;font-weight:900}
    @media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <h1>푸끼몬 신체검사</h1>
  <div class="sub">전체 포켓몬의 렌더 크기/위치만 빠르게 보는 검수 페이지입니다. scale, 내/상대 px 높이, ratio, 위치값을 함께 표시합니다. 이상한 포켓몬은 “이름 + 80%/120%/위/아래/좌/우”로 알려주면 됩니다. <a href="/size-admin.html" style="font-weight:900;color:#1d4ed8">크기 관리자 열기</a></div>
  <div class="controls">
    <input id="search" placeholder="포켓몬 이름/API명 검색 예: 리자몽, charizard" />
    <select id="side">
      <option value="both">앞/뒤 둘 다</option>
      <option value="mine">내 포켓몬 뒷모습</option>
      <option value="opponent">상대 포켓몬 앞모습</option>
    </select>
    <select id="filter">
      <option value="all">전체</option>
      <option value="overrides">수동 보정만</option>
      <option value="small">소형/작은 포켓몬</option>
      <option value="large">대형/위엄 포켓몬</option>
      <option value="flying">날개형/비행</option>
    </select>
    <select id="sort">
      <option value="id">번호순</option>
      <option value="name">이름순</option>
      <option value="scale-desc">큰 scale순</option>
      <option value="scale-asc">작은 scale순</option>
    </select>
    <button id="copyList">현재 목록 복사</button>
  </div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <section class="grid" id="grid"></section>
</main>
<script src="/renderProfiles.js"></script>
<script src="/size-check-data.js"></script>
<script>
(function(){
  const data = Array.isArray(window.POOKI_SIZE_CHECK_DATA) ? window.POOKI_SIZE_CHECK_DATA : [];
  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const side = document.getElementById('side');
  const filter = document.getElementById('filter');
  const sort = document.getElementById('sort');
  const summary = document.getElementById('summary');
  const overrides = window.POOKI_RENDER_PROFILES?.OVERRIDES || {};
  const groups = window.POOKI_RENDER_PROFILES?.GROUP_BY_API_NAME || {};
  let customProfiles = {};
  async function loadCustomProfiles(){
    try{
      const res = await fetch('/api/render-profiles/custom');
      const data = await res.json();
      customProfiles = data?.profiles || {};
      window.POOKI_RENDER_PROFILES?.setCustomOverrides?.(customProfiles);
    }catch(e){ customProfiles = {}; }
  }

  function apiName(p){ return String(p.apiName || p.name || '').toLowerCase().replace(/_/g,'-'); }
  function profileOf(p){ return window.POOKI_RENDER_PROFILES?.getRenderProfile?.(p) || {}; }
  function num(v,f=0){ const n=Number(v); return Number.isFinite(n)?n:f; }
  function spriteSize(p,isMine){
    const profile=profileOf(p); const scale=num(profile.scale ?? p.spriteScale,1);
    const base=num(profile.baseHeight || (isMine?160:148), isMine?160:148);
    const height=Math.round(base*scale);
    const widthRatio=Math.max(1.45,Math.min(2.85,num(profile.widthRatio,1.75)));
    return {height,maxWidth:Math.round(height*widthRatio)};
  }
  function offsets(p,isMine){
    const profile=profileOf(p);
    const x=isMine ? num(profile.playerOffsetX ?? profile.offsetX,0) : num(profile.opponentOffsetX ?? profile.offsetX,0);
    const y=num(profile.offsetY,0); return {x:Math.round(x),y:Math.round(y)};
  }
  function spriteHtml(p,isMine,bothClass){
    const src = isMine ? p.backSprite : p.frontSprite;
    const s=spriteSize(p,isMine); const o=offsets(p,isMine);
    const cls = isMine ? (bothClass?'both-mine':'mine') : (bothClass?'both-opponent':'opponent');
    return `<div class="sprite-wrap ${cls}" style="--pokemon-offset-x:${o.x}px;--pokemon-offset-y:${o.y}px">${src?`<img class="sprite" loading="lazy" src="${src}" style="height:${s.height}px;max-width:${s.maxWidth}px" />`:`<div class="sprite missing">?</div>`}</div>`;
  }
  function card(p){
    const prof=profileOf(p); const api=apiName(p); const isOverride=!!overrides[api] || !!customProfiles[api];
    const mode=side.value;
    const stage = mode==='both' ? spriteHtml(p,true,true)+spriteHtml(p,false,true) : spriteHtml(p,mode==='mine',false);
    const mineSize = spriteSize(p, true);
    const opponentSize = spriteSize(p, false);
    const tuning = prof.tuningMultiplier ? ` / tuning ${(num(prof.tuningMultiplier,1)*100).toFixed(0)}%` : '';
    const profText = `scale ${num(prof.scale,1).toFixed(2)}${tuning} / 내 ${mineSize.height}px / 상대 ${opponentSize.height}px / ratio ${num(prof.widthRatio,1.75).toFixed(2)} / x ${Math.round(num(prof.offsetX,0))} / px ${Math.round(num(prof.playerOffsetX ?? prof.offsetX,0))} / ox ${Math.round(num(prof.opponentOffsetX ?? prof.offsetX,0))} / y ${Math.round(num(prof.offsetY,0))}`;
    return `<article class="card" data-name="${p.name}" data-api="${api}">
      <div class="meta"><div><div class="name">#${p.id} ${p.name}</div><div class="api">${api} ${customProfiles[api]?'<span class="ok">관리자저장</span>':(isOverride?'<span class="ok">수동보정</span>':'<span class="warn">자동</span>')}</div><div class="types">${(p.types||[]).map(t=>`<span class="type">${t}</span>`).join('')}</div></div><div class="stat">H ${p.height ?? '-'}<br/>sprite ${p.spriteScale ?? '-'}</div></div>
      <div class="mini-stage"><div class="ground-line"></div>${stage}</div>
      <div class="profile">${profText}</div>
    </article>`;
  }
  function applyFilter(list){
    const q=search.value.trim().toLowerCase(); const f=filter.value;
    let arr=list.filter(p=>!q || p.name.includes(q) || apiName(p).includes(q));
    if(f==='overrides') arr=arr.filter(p=>overrides[apiName(p)]);
    if(f==='small') arr=arr.filter(p=>['tiny','small','floatingTiny'].includes(groups[apiName(p)]) || num(profileOf(p).scale,1)<.9);
    if(f==='large') arr=arr.filter(p=>['large','huge','tall','legendaryWide'].includes(groups[apiName(p)]) || num(profileOf(p).scale,1)>1.18);
    if(f==='flying') arr=arr.filter(p=>['wideFlying','legendaryWide'].includes(groups[apiName(p)]) || (p.types||[]).includes('flying'));
    if(sort.value==='name') arr.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    else if(sort.value==='scale-desc') arr.sort((a,b)=>num(profileOf(b).scale,1)-num(profileOf(a).scale,1));
    else if(sort.value==='scale-asc') arr.sort((a,b)=>num(profileOf(a).scale,1)-num(profileOf(b).scale,1));
    else arr.sort((a,b)=>num(a.id)-num(b.id));
    return arr;
  }
  function render(){
    const arr=applyFilter(data);
    summary.innerHTML = `<span class="badge">표시 ${arr.length} / 전체 ${data.length}</span><span class="badge">수동 보정 ${data.filter(p=>overrides[apiName(p)]).length}</span><span class="badge">현재 보기: ${side.options[side.selectedIndex].textContent}</span>`;
    grid.innerHTML=arr.map(card).join('');
  }
  [search,side,filter,sort].forEach(el=>el.addEventListener('input',render));
  document.getElementById('copyList').addEventListener('click',async()=>{
    const arr=applyFilter(data);
    const text=arr.map(p=>`${p.name}(${apiName(p)}) scale=${num(profileOf(p).scale,1).toFixed(2)} x=${Math.round(num(profileOf(p).offsetX,0))} px=${Math.round(num(profileOf(p).playerOffsetX ?? profileOf(p).offsetX,0))} ox=${Math.round(num(profileOf(p).opponentOffsetX ?? profileOf(p).offsetX,0))} y=${Math.round(num(profileOf(p).offsetY,0))}`).join('\n');
    try{ await navigator.clipboard.writeText(text); alert('현재 목록을 복사했습니다.'); }catch(e){ prompt('복사할 목록', text); }
  });
  loadCustomProfiles().finally(render);
})();
</script>
</body>
</html>
